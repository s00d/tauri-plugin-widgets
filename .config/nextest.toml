# cargo-nextest (https://nexte.st): `pnpm test:rust:nextest`, CI: `--profile ci`.
# Doctests are not run by nextest: `cargo test --doc --all-features`.

[profile.default]
# Slowest test today is ~2.3 s (receipt model test). A hung test (or a mutant that loops)
# is marked slow after 5 s and killed after 10 s instead of stalling the run.
slow-timeout = { period = "5s", terminate-after = 2 }

# Quarantine: tests that depend on wall-clock TTLs, a local HTTP stub or shared files
# get retries. A retry that passes is reported as FLAKY (and in the CI JUnit file) —
# fix the test and drop it from here, don't widen the filter.
[[profile.default.overrides]]
filter = '''
    test(/^image_prefetch::/)
    | binary(transports)
    | binary(image_prefetch)
'''
retries = { backoff = "fixed", count = 2, delay = "1s" }

# Slow by design, not hung: the IPC model test runs 16 random cases of up to 30 commands
# with a full state check after each (~2-3 s idle); the activity stories wait for the
# island's real timers (delayed dismissal, ~1.2 s hover collapse). Both stretch on a
# loaded machine.
[[profile.default.overrides]]
filter = 'binary(offline_model) | binary(activities)'
slow-timeout = { period = "15s", terminate-after = 2 }

[profile.ci]
fail-fast = false
failure-output = "immediate-final"

[profile.ci.junit]
# target/nextest/ci/junit.xml
path = "junit.xml"
store-success-output = false
store-failure-output = true
