name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf pkg-config libgtk-layer-shell-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test
          cache-on-failure: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Rust lib tests
        run: cargo test --lib

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # .config/nextest.toml: quarantined tests retry and show up as FLAKY; JUnit for the run.
      - name: Rust integration tests (proptest, transports, snapshots, mock runtime)
        run: cargo nextest run --all-features --profile ci

      - name: Rust doctests
        run: cargo test --doc --all-features

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nextest-junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

      - name: Codegen drift
        run: |
          cargo run --bin gen-schema --features codegen
          cargo run --bin gen-ts --features codegen
          cargo run --bin gen-native --features codegen
          cargo test --lib capabilities::write_docs::capability_matrix_doc_matches
          git diff --exit-code schemas/widget-config.v1.json guest-js/generated/widget-types.ts \
            docs/generated/capability-matrix.md swift/Sources/TauriWidgets/Generated android/src/main/java/render

      # Builds dist-cli too, which docs:check runs.
      - name: JS build
        run: pnpm build

      - name: Docs drift
        run: pnpm docs:check

      - name: TS unit tests (shared resolve fixtures)
        run: pnpm test:unit

      - name: CLI tests (node --test tests/cli)
        run: pnpm test:cli

  # Same crate on Windows (Adaptive Cards, Widgets Board store paths) + the C# widget template.
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Keep LF: the drift tests compare generated files byte for byte with the checkout.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-windows
      - name: cargo test --all-features
        run: cargo test --all-features
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # The template has `{{...}}` placeholders that `init-windows` fills (as scripts/win/pack.ps1):
      # build a filled copy.
      - name: dotnet build templates/windows-widget
        shell: bash
        run: |
          work="$RUNNER_TEMP/windows-widget"
          cp -R templates/windows-widget "$work"
          find "$work" -type f \( -name '*.cs' -o -name '*.csproj' -o -name '*.xml' -o -name '*.json' -o -name '*.appxmanifest' \) -exec sed -i \
            -e 's/{{WIDGET_PROVIDER_CLSID}}/6f1d6c1e-3b8a-4c55-9a5e-2f4d8b7c9a10/g' \
            -e 's/{{WIDGET_DISPLAY_NAME}}/TauriWidgets/g' \
            -e 's/{{PACKAGE_NAME}}/TauriWidgets/g' \
            -e 's/{{WIDGET_EXTENSION_ID}}/TauriWidgets.Widgets/g' \
            -e 's/{{WIDGET_DEFINITION_ID}}/TauriWidgets.Widget/g' {} +
          if grep -rn '{{[A-Z_]*}}' "$work" --include='*.cs' --include='*.csproj' --include='*.xml' --include='*.json' --include='*.appxmanifest'; then
            echo "::error::unfilled template placeholder"; exit 1
          fi
          for proj in "$work"/*/*.csproj; do
            dotnet build "$proj" -c Release -p:Platform=x64
          done

  # The Swift package compiled for the iOS Simulator SDK (swift test above runs on macOS only).
  ios-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: xcodebuild (iOS Simulator)
        working-directory: swift
        run: xcodebuild build -scheme TauriWidgets -destination 'generic/platform=iOS Simulator'

  # The crate type-checks for the mobile targets (mobile.rs, cfg(mobile) command paths).
  mobile-targets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            os: ubuntu-latest
          - target: aarch64-apple-ios
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: cargo check --target ${{ matrix.target }}
        run: cargo check --lib --target ${{ matrix.target }}

  # Desktop renderer in Chromium. Pinned image = pinned browser + fonts, so pixel
  # goldens (tests/golden/linux-chromium) are reproducible. Keep the tag equal to the
  # @playwright/test version in pnpm-lock.yaml.
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    env:
      # Missing golden = failure (tests/desktop/cases.ts GOLDEN_STRICT).
      CI: "true"
      HOME: /tmp/home
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Image tag matches @playwright/test
        run: |
          v="$(node -p 'require("@playwright/test/package.json").version')"
          [ "$v" = "1.63.0" ] || { echo "::error::@playwright/test is $v; bump the container image tag"; exit 1; }
      - name: Build widget.html
        run: pnpm build
      - name: Playwright (render + events)
        run: pnpm test:desktop
      - name: Geometry gate
        run: pnpm test:geometry
      - name: Flaky tests (passed on retry)
        if: always()
        run: node tests/desktop/flaky-report.mjs test-results/results.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-diffs
          path: |
            out/linux-chromium
            test-results
          if-no-files-found: ignore

  # SwiftUI package: resolve fixtures, decoding, iOS/macOS render goldens.
  # Goldens are SwiftUI renders from macOS 26: an older runner draws text and shapes differently.
  swift:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: swift
        run: swift test

  # Glance renderer under Robolectric: resolve fixtures, whole-tree geometry baselines.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The Gradle project the plugin depends on (`:tauri-android`). build.rs copies it only
      # when compiling for Android, so take it from the locked tauri crate directly.
      - name: tauri-android project
        run: |
          src="$(dirname "$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name=="tauri") | .manifest_path')")/mobile/android"
          mkdir -p android/.tauri
          cp -R "$src" android/.tauri/tauri-api
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Android unit tests
        working-directory: android
        run: ./gradlew :testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: android/build/reports/tests
