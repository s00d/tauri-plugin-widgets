name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      cross_targets:
        description: "Also run expensive rust-ios + rust-windows jobs"
        type: boolean
        default: false

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tauri (and optional `linux` feature) need GTK/WebKit on the Linux host.
      - name: Install Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Lib tests
        run: cargo test --lib
      - name: Android target check
        run: cargo check --target aarch64-linux-android --lib
      - name: Codegen drift
        run: |
          cargo run --bin gen-schema --features codegen
          cargo run --bin gen-ts --features codegen
          cargo test --lib capabilities::write_docs::capability_matrix_doc_matches
          git diff --exit-code schemas/widget-config.v1.json guest-js/generated/widget-types.ts docs/guide/_generated/capability-matrix.md

  # macOS / Windows cross-checks are expensive — manual only (Actions minutes).
  rust-ios:
    if: github.event_name == 'workflow_dispatch' && inputs.cross_targets
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: iOS target check
        run: cargo check --target aarch64-apple-ios --lib

  rust-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.cross_targets
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install llvm-rc (tauri-winres)
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Install cargo-xwin
        run: cargo install cargo-xwin --locked
      - name: Plugin xwin check
        run: cargo xwin check --target x86_64-pc-windows-msvc --lib
      - name: Demo example xwin build
        working-directory: examples/tauri-plugin-widgets-example/src-tauri
        run: cargo xwin build --target x86_64-pc-windows-msvc

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
