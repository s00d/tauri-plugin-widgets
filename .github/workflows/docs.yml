name: docs

permissions:
  contents: write

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "scripts/**"
      - "schemas/**"
      - "tests/cases/**"
      - "tests/fixtures/**"
      - "tests/golden/**"
      - "guest-js/**"
      - "permissions/**"
      - "widget.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/**"
      - "schemas/**"
      - "tests/cases/**"
      - "tests/fixtures/**"
      - "tests/golden/**"
      - "guest-js/**"
      - "permissions/**"
      - "widget.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

# Node-only: VitePress build + Pages deploy.
# Generated markers / capability matrix are committed locally
# (`pnpm docs:generate`, `cargo test --lib capabilities::write_docs::…`).
# Drift of the Rust-owned matrix is checked in CI (`ci.yml` Codegen drift), not here.

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI (docs:check uses dist-cli)
        run: pnpm build

      - name: Docs check (committed markers up to date)
        run: pnpm docs:check

      - name: Docs build
        run: pnpm -C docs build

      - name: Add nojekyll
        run: touch docs/.vitepress/dist/.nojekyll

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: docs/.vitepress/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
