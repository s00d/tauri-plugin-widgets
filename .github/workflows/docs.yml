name: docs

permissions:
  contents: write

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "scripts/**"
      - "schemas/**"
      - "tests/cases/**"
      - "tests/fixtures/**"
      - "tests/golden/**"
      - "guest-js/**"
      - "widget-src/**"
      - "src/commands.rs"
      - "permissions/**"
      - "CHANGELOG.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

# Nuxt (docs/, own lockfile) + Pages deploy.
# Element pages, showcase and capability matrix are committed marker blocks (`pnpm docs:generate`);
# `docs:check` fails when they are stale. Reference pages (JS API, commands, permissions, changelog)
# are generated at build time by docs/scripts/generate.mjs.

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI (docs:generate uses dist-cli)
        run: pnpm build

      - name: Docs check (committed markers up to date)
        run: pnpm docs:check

      - name: Copy goldens and gallery data into docs/public
        run: pnpm docs:generate

      - name: Install docs dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build (reference pages + nuxt generate)
        working-directory: docs
        env:
          NUXT_APP_BASE_URL: /tauri-plugin-widgets/
        run: pnpm generate

      - name: Add .nojekyll
        run: touch docs/.output/public/.nojekyll

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: docs/.output/public
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
