[package]
name = "tauri-plugin-widgets"
version = "0.8.0"
authors = ["s00d"]
description = "Tauri plugin for App Widgets on Android, iOS, and macOS (WidgetKit); Windows Widgets Board (Adaptive Cards) + desktop webview; Linux desktop webview with X11 DESKTOP pin."
edition = "2021"
rust-version = "1.80"
exclude = [
  # App / JS workspace (published via npm, not crates.io)
  "/examples",
  "/dist-js",
  "/dist-cli",
  "/guest-js",
  "/src-cli",
  "/widget-src",
  "/templates",
  "/swift",
  "/node_modules",
  "/docs",
  "/scripts",
  "/fuzz",
  "/.github",
  "/artifacts",
  # Visual / platform harnesses (PNG goldens are bulk of the crate)
  "/tests/golden",
  "/tests/expected",
  "/tests/desktop",
  "/tests/windows",
  "/tests/macos",
  "/tests/linux",
  "/tests/cli",
  "/tests/demos",
  "/tests/unit",
  "vitest.config.ts",
  "stryker.config.json",
  "/.cargo",
  "/.config",
  "/android/pitest.gradle",
  # Native test trees (not needed to compile the plugin)
  "/android/src/test",
  "/android/src/androidTest",
  "/ios/Tests",
  # Misc non-crate assets
  "demo.gif",
  "preview.png",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "tsconfig.json",
  "rollup.config.mjs",
  "Justfile",
]
links = "tauri-plugin-widgets"
license = "MIT"
repository = "https://github.com/s00d/tauri-plugin-widgets"

[package.metadata.docs.rs]
# Do not pass `--cfg docsrs` via rustc-args: docs.rs applies those flags to
# *dependencies* too, and old crates (e.g. winnow 0.5) still gate on removed
# nightly features like `doc_auto_cfg` → E0557. Use rustdoc-args only.
# Skip `all-features`: `layer-shell` needs gtk-layer-shell sys libs.
features = ["schema", "rasterize", "codegen", "workerw", "macos-private-api", "image-prefetch"]
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.platforms.support]
android = { level = "full", notes = "Full AppWidgetManager + SharedPreferences support" }
ios = { level = "full", notes = "WidgetKit (iOS 17+) + App Groups shared container" }
macos = { level = "full", notes = "WidgetKit (macOS 14+) + App Groups shared container" }
windows = { level = "partial", notes = "Widgets Board Adaptive Cards + desktop webview fallback; optional workerw wallpaper" }
linux = { level = "partial", notes = "Desktop webview + X11 _NET_WM_WINDOW_TYPE_DESKTOP; optional gtk-layer-shell on Wayland" }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
base64 = "0.22"
schemars = { version = "0.8", optional = true }
resvg = { version = "0.45", optional = true }

# ureq → rustls → ring needs NDK C toolchain on Android; Rust prefetch is cfg'd
# off there anyway (Kotlin localPath). Keep the crate off the Android graph.
[target.'cfg(not(target_os = "android"))'.dependencies]
ureq = { version = ">=2.0, <2.12", default-features = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Direct gtk 0.18 (same as Tauri 2). Do not bump to 0.19: gtk-sys links=gtk-3 clash.
# `cargo outdated` latest pass will error unless `--exclude gtk`.
gtk = { version = "0.18", optional = true }
raw-window-handle = { version = "0.6", optional = true }
gtk-layer-shell = { version = "0.8", optional = true }
notify-rust = { version = "4.11", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = { version = "0.7", optional = true }

[dev-dependencies]
tempfile = "3"
proptest = { version = "1", default-features = false, features = ["std"] }
# tests/common + offline_model / story tests: MockRuntime IPC + the real ACL from permissions/*.toml.
tauri = { version = "2", features = ["test"] }
tauri-utils = "2"
toml = "0.8"
# tests/state_machine.rs: model-based test of the widget state layers (same proptest 1.x).
proptest-state-machine = "0.9"

[features]
# `linux` pulls gtk for the DESKTOP pin (GDK type hint / keep-below / sticky before first map). Other OS backends follow `target_os` only.
# `rasterize` is opt-in (resvg) for Adaptive Cards chart/canvas/gauge → PNG data-URI.
# `image-prefetch` is default on non-Android (ureq target-gated off Android).
default = ["linux", "image-prefetch"]
linux = ["dep:raw-window-handle", "dep:gtk"]
schema = ["dep:schemars"]
codegen = ["schema"]
rasterize = ["dep:resvg"]
image-prefetch = ["dep:ureq"]
# Transparent desktop widget windows on macOS (requires host `tauri.conf` macosPrivateApi).
macos-private-api = ["tauri/macos-private-api"]
# Windows wallpaper WorkerW parenting (not Widgets Board).
workerw = []
# Wayland: remap widget windows onto gtk-layer-shell Background (requires `linux`).
layer-shell = ["linux", "dep:gtk-layer-shell"]
# Live activities as system notifications (`activitySurface: "notification"`, or when no window
# can open): Linux notify-rust (replace-id), Windows toast progress. macOS keeps the window.
notify = ["dep:notify-rust", "dep:tauri-winrt-notification"]

[[bin]]
name = "gen-schema"
path = "src/bin/gen_schema.rs"
required-features = ["codegen"]

[[bin]]
name = "gen-ts"
path = "src/bin/gen_ts.rs"
required-features = ["codegen"]

[[bin]]
name = "gen-native"
path = "src/bin/gen_native.rs"
required-features = ["codegen"]

[[bin]]
name = "resolve-stdin"
path = "src/bin/resolve_stdin.rs"

[[bin]]
name = "gen-adaptive-snapshots"
path = "src/bin/gen_adaptive_snapshots.rs"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

# Tests (and every cargo-mutants mutant) build in the dev profile. resvg / tiny-skia in debug
# make the Adaptive Card raster tests ~40x slower; optimizing dependencies only keeps the
# crate's own rebuild (the part a mutant changes) as fast as before.
[profile.dev.package."*"]
opt-level = 2

# cargo-mutants builds every mutant with this profile (`.cargo/mutants.toml`): no debug info
# links faster; nothing reads a backtrace of a mutant.
[profile.mutants]
inherits = "test"
debug = "none"
