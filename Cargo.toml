[package]
name = "tauri-plugin-widgets"
version = "0.4.0"
authors = ["s00d"]
description = "A Tauri plugin to interact with App Widgets on Android, iOS, and macOS (WidgetKit). On Windows/Linux a desktop-widget window approach is supported."
edition = "2021"
rust-version = "1.70"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules", "demo.gif"]
links = "tauri-plugin-widgets"
license = "MIT"
repository = "https://github.com/s00d/tauri-plugin-widgets"

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs"]
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.platforms.support]
android = { level = "full", notes = "Full AppWidgetManager + SharedPreferences support" }
ios = { level = "full", notes = "WidgetKit (iOS 17+) + App Groups shared container" }
macos = { level = "full", notes = "WidgetKit (macOS 14+) + App Groups shared container" }
windows = { level = "partial", notes = "Widgets Board Adaptive Cards + desktop webview fallback; optional workerw wallpaper" }
linux = { level = "partial", notes = "Desktop webview + X11 _NET_WM_WINDOW_TYPE_DESKTOP; optional gtk-layer-shell on Wayland" }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
schemars = { version = "0.8", optional = true }
resvg = { version = "0.45", optional = true }
base64 = { version = "0.22", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
x11rb = { version = "0.13", optional = true }
raw-window-handle = { version = "0.6", optional = true }
gtk-layer-shell = { version = "0.8", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["rasterize", "linux", "windows", "macos", "ios", "android"]
# Platform backends (optional). Default enables all; pick a subset with
# `default-features = false` + explicit list (e.g. `["rasterize", "linux", "windows"]`).
linux = ["dep:x11rb", "dep:raw-window-handle"]
windows = []
macos = []
ios = []
android = []
# Convenience: every OS backend.
all-platforms = ["linux", "windows", "macos", "ios", "android"]
schema = ["dep:schemars"]
codegen = ["schema"]
# SVG → PNG for Adaptive Cards (chart/canvas/gauge).
rasterize = ["dep:resvg", "dep:base64"]
# Enables transparent desktop widget windows on macOS (requires host `tauri.conf` macosPrivateApi).
macos-private-api = ["tauri/macos-private-api"]
# Windows wallpaper WorkerW parenting (not Widgets Board).
workerw = ["windows"]
# Wayland: remap widget windows onto gtk-layer-shell Background (Linux only).
layer-shell = ["linux", "dep:gtk-layer-shell"]

[[bin]]
name = "gen-schema"
path = "src/bin/gen_schema.rs"
required-features = ["codegen"]

[[bin]]
name = "gen-ts"
path = "src/bin/gen_ts.rs"
required-features = ["codegen"]

[[bin]]
name = "gen-windows-goldens"
path = "src/bin/gen_windows_goldens.rs"
required-features = ["rasterize"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
