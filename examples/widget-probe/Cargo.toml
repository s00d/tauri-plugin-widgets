[package]
name = "widget-probe"
version = "0.1.0"
description = "Minimal Tauri host that opens one widget window from a fixture (Linux harness)."
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-widgets = { path = "../.." }

[features]
default = []
# Forward plugin OS / layer-shell features for harness variants.
linux = ["tauri-plugin-widgets/linux"]
windows = ["tauri-plugin-widgets/windows"]
macos = ["tauri-plugin-widgets/macos"]
ios = ["tauri-plugin-widgets/ios"]
android = ["tauri-plugin-widgets/android"]
layer-shell = ["tauri-plugin-widgets/layer-shell"]
